name: Request an agent credential boundary check
description: Confirm fit for the US$25 founding package. No payment is due yet.
title: "Agent credential check request: "
labels:
  - order-request
body:
  - type: markdown
    attributes:
      value: |
        Share only public documentation and already-redacted examples.
        Do not include API keys, bearer tokens, passwords, private configuration, customer data, or payment details.

  - type: input
    id: public-path
    attributes:
      label: Public setup guide, repository, or product URL
      placeholder: https://github.com/example/mcp-server
    validations:
      required: true

  - type: textarea
    id: first-task
    attributes:
      label: First setup task to review
      description: Describe what a new operator should be able to configure without sending a secret through chat or public support.
      placeholder: Install the plugin and connect one MCP server with a scoped token.
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: Primary client
      options:
        - Cursor
        - Claude Code or Desktop
        - Codex or ChatGPT Desktop
        - VS Code or GitHub Copilot
        - Another MCP client
        - Client-agnostic documentation
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: I understand this is a US$25 review of one public setup path and redacted examples, not penetration testing, secret validation, compliance certification, or implementation.
          required: true
        - label: I will not place a live or private credential in this issue.
          required: true
        - label: I understand the one-business-day delivery clock starts after public scope confirmation and cleared payment.
          required: true
